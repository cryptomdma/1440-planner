org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AGP 8 needs JDK 17. This is the same override the (gitignored) phone build carries in
# apps/mobile/android/gradle.properties: Android Studio's bundled JBR. Adjust on a machine
# where Studio lives elsewhere, or delete the line if JAVA_HOME already points at a JDK 17.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
