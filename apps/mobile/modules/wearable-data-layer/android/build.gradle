// Expo local module (autolinked from apps/mobile/modules by expo-modules-autolinking; no
// entry in android/settings.gradle is needed). Same shape as the modules shipped in
// node_modules, e.g. expo-haptics/android/build.gradle.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.planner1440'
version = '0.1.0'

android {
  namespace 'com.planner1440.wearable'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
